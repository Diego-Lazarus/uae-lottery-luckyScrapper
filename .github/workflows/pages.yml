name: Lucky Day snapshot and Pages deploy

on:
  schedule:
    - cron: "5 18 * * 3,6"   # 22:05 UAE, Wed/Sat (primary)
    - cron: "5 19 * * 3,6"   # 23:05 UAE, Wed/Sat (intentionally redundant backup)
  workflow_dispatch:
    inputs:
      mode:
        description: "incremental = reconcile the latest 10; full = rebuild the whole history"
        type: choice
        options: [incremental, full]
        default: incremental
      force_deploy:
        description: "Build and deploy even if the data did not change"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write   # commit the updated snapshot
  pages: write
  id-token: write

concurrency:
  group: luckyday-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.snap.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Update snapshot from the official API
        id: snap
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.mode }}" = "full" ]; then
            npm run snapshot:full
          else
            npm run snapshot
          fi

      - name: Commit changed snapshot
        if: steps.snap.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/luckyday.json
          git commit -m "data: Lucky Day snapshot ${{ steps.snap.outputs.latest_draw }}"
          git push

  deploy:
    needs: snapshot
    # Deploy only when the data changed, on code pushes, or when forced.
    if: >-
      needs.snapshot.outputs.changed == 'true' ||
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.force_deploy)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}   # includes the snapshot commit pushed above
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
